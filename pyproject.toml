[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hatchsvg"
dynamic = ["version"]
description = "Convert images to hatched SVG files for Cricut pen plotters"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "hatchsvg contributors", email = "contributors@hatchsvg.dev"}
]
keywords = ["cricut", "pen-plotter", "svg", "hatching", "hatch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.20",
    "pillow>=9.0",
]

[project.optional-dependencies]
plot = ["rich>=13.0", "scipy>=1.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
notebook = ["jupyter>=1.1", "ipykernel>=6.0", "matplotlib>=3.5", "nbformat>=5.10"]
# For the palette_extractor.py Streamlit app (image -> palette JSON)
palette = ["streamlit>=1.30", "colorgram.py>=1.2"]

[project.scripts]
hatchsvg = "hatchsvg.cli:main"

[project.urls]
Homepage = "https://github.com/Veedubin/hatchsvg"
Repository = "https://github.com/Veedubin/hatchsvg.git"
Issues = "https://github.com/Veedubin/hatchsvg/issues"

[tool.hatch.version]
path = "src/hatchsvg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hatchsvg"]

[tool.hatch.build.targets.wheel.force-include]
"color_palettes" = "hatchsvg/data/palettes"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Insert `src/` at the front of sys.path so the installed `hatchsvg` package
# (under src/hatchsvg/) is importable during testing.
pythonpath = ["src"]
# Make the notebook helpers importable for the smoke tests
addopts = "-v --tb=short --cov=hatchsvg --cov-report=term-missing"

[tool.coverage.run]
source = ["src/hatchsvg"]
omit = ["*/tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The legacy script is a verbatim extract of the original 1328-line
# png2svg.py from v1.0.0 and is preserved for historical reference. It
# has pre-existing style violations and one real bug (undefined
# 'visible' on line 930); we deliberately don't fix it here — the
# cleaned-up algorithm lives in src/hatchsvg/core.py. The script's
# FILENAME is kept as png2svg_legacy.py so the historical reference
# is unambiguous.
"scripts/png2svg_legacy.py" = ["N806", "F821", "E", "F", "W", "I001"]

# Jupyter notebooks are cell-based; the rules that assume linear
# Python source don't apply:
#   I001 — import sort: cells are independent execution units
#   E402 — "import not at top of cell": cells have arbitrary execution
#          order, so "top of cell" has no stable meaning
#   F811 — redefinition: same import reappearing in different cells is
#          normal in Jupyter
# The notebook source is generated by scripts/build_notebooks.py, which
# is the review surface — not the .ipynb JSON.
"notebooks/*.ipynb" = ["I001", "E402", "F811"]

# Executed notebook artifacts (*_executed.ipynb) are produced by
# nbconvert --execute. They contain pre-rendered outputs, execution
# counts, and metadata. They are NOT source code and should not be
# linted at all.
"notebooks/*_executed.ipynb" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
